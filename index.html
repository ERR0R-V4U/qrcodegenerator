<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERR0R-V4U QR Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Segoe UI,sans-serif; }
body {
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg, #020617, #0f172a, #1e293b);
}
.container {
  width:100%;
  max-width:480px;
  padding:30px;
  border-radius:30px;
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 0 30px rgba(0,0,0,.5);
  text-align:center;
}
.logo { font-size:35px; margin-bottom:8px; }
h1 { color:white; font-size:28px; margin-bottom:10px; }
.subtitle { color:#94a3b8; font-size:14px; margin-bottom:25px; }
.inputBox {
  width:100%;
  padding:15px;
  background:#0f172a;
  border:none;
  outline:none;
  border-radius:15px;
  font-size:15px;
  color:white;
  border:1px solid rgba(255,255,255,.08);
  margin-bottom:20px;
}
.inputBox::placeholder { color:#64748b; }
.buttons { display:flex; gap:10px; }
button {
  flex:1;
  padding:14px;
  border:none;
  border-radius:15px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}
.generate { background:linear-gradient(45deg,#00c853,#00e676); color:white; }
.download { background:linear-gradient(45deg,#0066ff,#00b0ff); color:white; }
button:hover { transform:translateY(-3px); }
.qrBox {
  margin-top:25px;
  padding:20px;
  background:white;
  border-radius:25px;
  display:inline-block;
  box-shadow:0 0 20px rgba(255,255,255,.15);
}
canvas { max-width:100%; }
.footer { margin-top:15px; color:#64748b; font-size:12px; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">⚡</div>
  <h1>ERR0R-V4U QR</h1>
  <p class="subtitle">Custom Exact Pattern QR Generator</p>
  <input id="txt" class="inputBox" placeholder="Enter URL or text" value="https://example.com">
  <div class="buttons">
    <button class="generate" onclick="makeQR()">Generate</button>
    <button class="download" onclick="downloadQR()">Download</button>
  </div>
  <div class="qrBox">
    <canvas id="qrCanvas"></canvas>
  </div>
  <div class="footer">Powered by ERR0R-V4U</div>
</div>

<script>
function makeQR() {
  let text = document.getElementById("txt").value.trim();
  if (!text) {
    alert("Enter text or URL");
    return;
  }

  try {
    // জেনারেট QR কোড (High Error Correction)
    let qr = qrcode(0, 'H');
    qr.addData(text);
    qr.make();

    let count = qr.getModuleCount();
    let canvas = document.getElementById("qrCanvas");
    let ctx = canvas.getContext("2d");
    
    // বড় ক্যানভাস সাইজ (যাতে প্যাটার্ন বসানোর পরেও কিছু জায়গা থাকে)
    let size = 600;
    canvas.width = size;
    canvas.height = size;

    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, size, size);

    let cell = size / count;

    // FULL QR CODE DRAW (NO SKIPPING)
    for (let row = 0; row < count; row++) {
      for (let col = 0; col < count; col++) {
        if (qr.isDark(row, col)) {
          ctx.fillStyle = "black";
          ctx.fillRect(col * cell, row * cell, Math.ceil(cell), Math.ceil(cell));
        }
      }
    }

    // এখন আপনার বড় সেন্টার প্যাটার্নটি আঁকি (ঠিক আপনার দেওয়া সাইজ)
    drawExactBigCenterPattern(ctx, size);

  } catch (err) {
    console.log(err);
    alert("Failed to generate");
  }
}

// আপনার দেওয়া এক্স্যাক্ট বড় প্যাটার্ন
function drawExactBigCenterPattern(ctx, size) {
  let x = size / 2;
  let y = size / 2;

  const layers = [
    { size: 160, color: "black" },  // বাইরের কালো বক্স
    { size: 130, color: "white" },  // সাদা লেয়ার
    { size: 100, color: "black" },  // কালো লেয়ার
    { size: 70, color: "white" },   // সাদা লেয়ার
    { size: 40, color: "black" },   // কালো লেয়ার
    { size: 20, color: "white" },   // সাদা লেয়ার
    { size: 8, color: "black" }     // কেন্দ্রের কালো বিন্দু
  ];

  layers.forEach(layer => {
    ctx.fillStyle = layer.color;
    ctx.fillRect(
      x - layer.size / 2,
      y - layer.size / 2,
      layer.size,
      layer.size
    );
  });
}

function downloadQR() {
  let canvas = document.getElementById("qrCanvas");
  let link = document.createElement("a");
  link.download = "ERR0R-V4U-QR.png";
  link.href = canvas.toDataURL();
  link.click();
}

makeQR();
</script>
</body>
</html>
